# Local commit-time gate for the Python library and examples. Mirrors the
# `python-lint` job in .github/workflows/build.yml, so what passes here passes CI.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files       # one-off sweep
#
# All rule configuration (including every deliberately-disabled rule and why)
# lives in the Python tree's pyproject.toml, not here.
#
# This file is exported to usbip-python verbatim, so the `files:` patterns match BOTH
# layouts: the package sits one level down in the monorepo and at the root there.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the pinned ruff in the build workflows (.github/workflows/
    # build.yml here and python/.github/workflows/build.yml, which ships to
    # usbip-python): a version skew makes `ruff format` disagree with itself and the
    # CI format gate fails on code that passed the commit hook.
    rev: v0.16.2
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
        files: ^(python/)?(usbip|examples)/
      - id: ruff-format
        name: ruff (format)
        files: ^(python/)?(usbip|examples)/
