name: docs

# Build the Python library reference (MkDocs) and publish it to GitHub Pages.
#
# mkdocs runs from the repository root - that is where doc/mkdocs.yml resolves its
# `--8<--` snippet base path and the `usbip` package it documents.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'usbip/**'
      # the guide pages embed these with `--8<--`
      - 'examples/**'
      - 'doc/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs tooling
        run: pip install -r doc/requirements.txt

      - name: Build Python library docs (MkDocs)
        run: mkdocs build --strict -f doc/mkdocs.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
